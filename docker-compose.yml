version: "3.8"

services:
  sensor-service:
    build: .
    ports:
      - "8000:8000"
    restart: always
    mem_limit: 80m
    cpus: "0.5"

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    ports:
      - "8428:8428"     # /vmui for UI, /api/v1/query for PromQL
    volumes:
      - ./victoriametrics.yml:/etc/victoriametrics/scrape.yml
      - vm_data:/victoria-metrics-data
    command:
      - "-promscrape.config=/etc/victoriametrics/scrape.yml"
      - "-retentionPeriod=7d"
      - "-storage.minFreeDiskSpaceBytes=100MB"
    restart: always
    mem_limit: 80m
    cpus: "0.5"

volumes:
  vm_data:
